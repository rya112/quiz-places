name: CI/CD Pipeline - Quiz Places

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci-cd-pipeline:
    name: Validação e Deploy (Vercel)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js (v24)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: 2. Validação de Código (Lint & TypeScript)
        run: |
          npm run lint
          npx tsc --noEmit

      - name: 3. Executar Testes Automatizados (Vitest)
        run: npm test

      - name: 4. Verificar Vulnerabilidades de Segurança (Audit)
        run: npm audit --audit-level=high

      - name: 5. Build do Projeto (Vite)
        run: npm run build

      - name: 6. Deploy na Vercel
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
